services:
  api:
    build:
      context: ./backend
      target: cpu
    container_name: toolbox-api
    restart: unless-stopped
    volumes:
      - ./data:/srv/data
      - ./models:/srv/models
    environment:
      - TZ=America/Costa_Rica
      - TOOLBOX_WORKERS=2
      - TOOLBOX_AI_WORKERS=1
      - TOOLBOX_JOB_TTL_HOURS=24

  web:
    build: ./frontend
    container_name: toolbox-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3090:80"
